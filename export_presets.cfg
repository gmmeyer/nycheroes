[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<!-- Phones and tablets: no page scrolling, zooming, selecting or long-press menus over the game; landscape (a turn-your-phone overlay while upright); full screen at the first tap where the browser can; the screen's safe area for Godot (scripts/util/device.gd reads window.nycPage). -->
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='theme-color' content='#000000'>
<style>
html, body {
	position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
body, #canvas { touch-action: none; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
#nyc-rotate {
	display: none; position: fixed; inset: 0; z-index: 100; background: #0b0d12; color: #fff;
	flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
	font: 600 21px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
#nyc-rotate small { font-weight: 400; font-size: 15px; opacity: 0.7; max-width: 21em; }
#nyc-rotate svg { width: 86px; height: 86px; animation: nyc-turn 2.6s ease-in-out infinite; }
@keyframes nyc-turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { html.nyc-touch #nyc-rotate { display: flex; } }
</style>
<script>
(function () {
	var forced = new URLSearchParams(location.search).get('touch');
	var touch = forced === '1' || (forced !== '0' && matchMedia('(pointer: coarse)').matches);
	var root = document.documentElement;
	var request = root.requestFullscreen || root.webkitRequestFullscreen;
	var canFullscreen = !!(request && (document.fullscreenEnabled || document.webkitFullscreenEnabled));
	var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	var meta = document.querySelector('meta[name=viewport]');
	if (!meta) {
		meta = document.createElement('meta');
		meta.name = 'viewport';
		document.head.appendChild(meta);
	}
	meta.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
	var probe = null;
	var firstTap = true;
	var armed = false;
	function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
	function enterFullscreen() {
		if (!canFullscreen || isFullscreen()) return;
		var lock = function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} };
		try {
			var result = request.call(root, { navigationUI: 'hide' });
			if (result && result.then) result.then(lock, function () {}); else lock();
		} catch (e) {}
	}
	// Browsers only go full screen during a tap; Godot sees touches a frame
	// later, so its full screen button arms this for when the finger lifts.
	window.addEventListener('touchend', function () {
		if (armed || (touch && firstTap)) enterFullscreen();
		firstTap = false;
		armed = false;
	}, true);
	function notInTextBox(e) {
		var tag = e.target && e.target.tagName;
		if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
	}
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
	document.addEventListener('dblclick', notInTextBox, { passive: false });
	document.addEventListener('contextmenu', notInTextBox);
	document.addEventListener('selectstart', notInTextBox);
	window.nycPage = {
		setTouch: function (on) { touch = on; root.classList.toggle('nyc-touch', on); },
		canFullscreen: function () { return canFullscreen; },
		isFullscreen: isFullscreen,
		armFullscreen: function () { armed = true; },
		// Notches and rounded corners: left, top, right, bottom, in CSS pixels.
		safeArea: function () {
			if (!probe) return '0,0,0,0';
			var s = getComputedStyle(probe);
			return [s.paddingLeft, s.paddingTop, s.paddingRight, s.paddingBottom].map(function (v) { return parseFloat(v) || 0; }).join(',');
		}
	};
	if (touch) root.classList.add('nyc-touch');
	document.addEventListener('DOMContentLoaded', function () {
		probe = document.createElement('div');
		probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
			+ 'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
		document.body.appendChild(probe);
		var rotate = document.createElement('div');
		rotate.id = 'nyc-rotate';
		rotate.innerHTML = `<svg viewBox='0 0 64 64' fill='none' stroke='#fff' stroke-width='3' stroke-linejoin='round'>
			<rect x='19' y='5' width='26' height='54' rx='5'/><path d='M28 50h8' stroke-linecap='round'/></svg>
			<div>Turn your ` + (Math.min(screen.width, screen.height) < 600 ? 'phone' : 'tablet') + ` sideways to play</div>`
			+ (canFullscreen ? '<small>Tap for full screen.</small>'
				: ios ? '<small>Tip: for full screen, tap Share, then Add to Home Screen.</small>' : '');
		document.body.appendChild(rotate);
	});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
